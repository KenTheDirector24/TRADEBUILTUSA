      <div class="header-actions">
        <button type="button" class="btn btn-sm header-actions__signin">Sign In</button>
        <button type="button" class="btn btn-sm header-actions__signup">Sign Up</button>
        <a href="account.html" class="btn btn-sm header-actions__account"__ACTIVE_ACCOUNT__ hidden>Account</a>
        <button type="button" class="header-actions__bell" aria-label="Announcements" aria-expanded="false" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="header-actions__bell-badge" hidden></span>
        </button>
        <div class="tb-announcements-panel">
          <div class="tb-announcements-panel__header">Announcements</div>
          <div class="tb-announcements-panel__list"></div>
        </div>
      </div>
      <script>
        (function () {
          try {
            if (localStorage.getItem("tb_signed_in_hint") === "1") {
              var bellBtn = document.querySelector(".header-actions__bell");
              if (bellBtn) bellBtn.hidden = false;
              var signInBtn = document.querySelector(".header-actions__signin");
              var signUpBtn = document.querySelector(".header-actions__signup");
              if (signInBtn && signUpBtn) {
                signUpBtn.style.display = "none";
                signInBtn.textContent = "Sign Out";
                signInBtn.classList.add("header-actions__signin--signed-in");
              }
              var accountLink = document.querySelector(".header-actions__account");
              if (accountLink) {
                accountLink.hidden = false;
                var profile = null;
                try {
                  var rawProfile = localStorage.getItem("tb_profile_hint");
                  profile = rawProfile ? JSON.parse(rawProfile) : null;
                } catch (e2) {}
                var firstName = (profile && profile.firstName) || "";
                var lastName = (profile && profile.lastName) || "";
                var photoURL = (profile && profile.photoURL) || "";
                var email = (profile && profile.email) || "";
                var initA = firstName.trim().charAt(0);
                var initB = lastName.trim().charAt(0);
                var initials = (initA || initB) ? (initA + initB).toUpperCase() : (email || "?").trim().charAt(0).toUpperCase();
                var displayName = firstName || "Account";
                accountLink.textContent = "";
                var avatar = document.createElement("span");
                avatar.className = "header-actions__avatar";
                if (photoURL) {
                  var img = document.createElement("img");
                  img.src = photoURL;
                  img.alt = "";
                  avatar.appendChild(img);
                } else {
                  var initialsEl = document.createElement("span");
                  initialsEl.className = "header-actions__avatar-initials";
                  initialsEl.textContent = initials;
                  avatar.appendChild(initialsEl);
                }
                var nameEl = document.createElement("span");
                nameEl.className = "header-actions__account-name";
                nameEl.textContent = displayName;
                accountLink.appendChild(avatar);
                accountLink.appendChild(nameEl);
                accountLink.dataset.tbPhoto = photoURL;
                accountLink.dataset.tbInitials = initials;
                accountLink.dataset.tbName = displayName;
              }
            }
          } catch (e) {}
        })();
      </script>
